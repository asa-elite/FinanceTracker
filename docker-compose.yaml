services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance-backend
    working_dir: /app
    env_file:
      - ./backend/.env.dev
    volumes:
      - ./backend:/app
      - gradle-cache:/home/gradle/.gradle
    ports:
      - "5174:5174"
    command: >
      gradle bootRun --no-daemon

    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: finance-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: finance-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  gradle-cache:
  ollama-data: