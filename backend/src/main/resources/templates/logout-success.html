<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceTracker | Logged Out</title>
    <style>
        :root {
            --bg-1: #f6f2e8;
            --bg-2: #dcebe1;
            --surface: #ffffff;
            --text: #1f2e2a;
            --muted: #566b62;
            --primary: #0f7b5f;
            --primary-strong: #0a5a45;
            --outline: #d2ddd8;
            --shadow: 0 16px 34px rgba(31, 46, 42, 0.16);
            --font-heading: "Poppins", "Segoe UI", "Helvetica Neue", sans-serif;
            --font-body: "Nunito Sans", "Segoe UI", "Helvetica Neue", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body);
            color: var(--text);
            background:
                radial-gradient(circle at 80% 15%, rgba(15, 123, 95, 0.16), transparent 40%),
                radial-gradient(circle at 15% 85%, rgba(231, 180, 90, 0.28), transparent 40%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            display: grid;
            place-items: center;
            padding: 1.25rem;
        }

        .card {
            width: min(520px, 100%);
            background: var(--surface);
            border: 1px solid var(--outline);
            border-radius: 18px;
            box-shadow: var(--shadow);
            text-align: center;
            padding: clamp(1.4rem, 3.5vw, 2.4rem);
        }

        h1 {
            margin: 0;
            font-family: var(--font-heading);
            font-size: clamp(1.6rem, 4vw, 2rem);
        }

        p {
            color: var(--muted);
            line-height: 1.55;
            margin: 0.85rem 0 1.2rem;
        }

        .btn {
            display: inline-block;
            padding: 0.78rem 1.08rem;
            border-radius: 12px;
            font: 700 0.92rem/1 var(--font-heading);
            color: #f6fbf8;
            text-decoration: none;
            background: linear-gradient(160deg, var(--primary), var(--primary-strong));
            box-shadow: 0 8px 16px rgba(15, 123, 95, 0.28);
            transition: transform 140ms ease, filter 140ms ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: saturate(1.04);
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@500;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="card">
        <h1>You are logged out</h1>
        <p>Your session has been closed. Sign in again whenever you are ready.</p>
        <a class="btn" th:href="@{/login}">Back to Login</a>
    </main>
</body>
</html>
